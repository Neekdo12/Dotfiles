# ==========================================
# GRUVBOX MATERIAL HYPRLOCK CONFIGURATION
# ==========================================

background {
    monitor =
    path = ~/Images/Wallpapers/special.jpg
    
    blur_passes = 3 
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.75
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

general {
    hide_cursor = true
}

# HODINY
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(d4be98) # fg
    font_size = 120
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# DATUM
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d. %B")"
    color = rgb(a89984) # grey0
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# POČASÍ
label {
    monitor =
    text = cmd[update:3600000] curl -s "wttr.in/?format=1" || echo "Počasí nedostupné"
    color = rgb(7daea3) # blue
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}

# VSTUPNÍ POLE PRO HESLO
input-field {
    monitor =
    size = 280, 60
    outline_thickness = 2
    dots_size = 0.25 
    dots_spacing = 0.35 
    dots_center = true
    
    outer_color = rgb(282828) # bg1
    inner_color = rgb(1d2021) # bg0
    font_color = rgb(d4be98) # fg
    capslock_color = rgb(d8a657) # yellow
    fail_color = rgb(ea6962) # red
    
    fade_on_empty = true
    fade_timeout = 1000 
    
    placeholder_text = <i>Zadejte heslo...</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    
    position = 0, -100
    halign = center
    valign = center
}

# OVLÁDÁNÍ / INFO O HUDBĚ (Bez problematických {{závorek}})
label {
    monitor =
    text = cmd[update:1000] title=$(playerctl metadata title 2>/dev/null); artist=$(playerctl metadata artist 2>/dev/null); if [ -n "$title" ]; then echo "󰎆  $title - $artist"; else echo "󰎆  Ticho"; fi
    color = rgb(a9b665) # green
    font_size = 13
    font_family = JetBrainsMono Nerd Font Muted
    position = 0, -180
    halign = center
    valign = center
}
